app-id: org.zxor.oronbox
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: oronbox

finish-args:
  - --talk-name=org.freedesktop.secrets
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=system-bus
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures/WatchScreenshots:create

modules:
  - name: oronbox
    buildsystem: simple
    build-commands:
      - mkdir -p /app/oronbox
      - cp -a bundle/. /app/oronbox/
      - install -Dm755 oronbox-wrapper /app/bin/oronbox
      - install -Dm644 org.zxor.oronbox.desktop /app/share/applications/org.zxor.oronbox.desktop
      - install -Dm644 org.zxor.oronbox.png /app/share/icons/hicolor/512x512/apps/org.zxor.oronbox.png
    sources:
      - type: dir
        path: ../../build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: ../../build/linux_staging/flatpak/org.zxor.oronbox.desktop
      - type: file
        path: ../../linux/icons/hicolor/512x512/apps/org.zxor.oronbox.png
      - type: script
        dest-filename: oronbox-wrapper
        commands:
          - exec /app/oronbox/oronbox "$@"
