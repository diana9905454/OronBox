name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check release scripts
        run: |
          set -euo pipefail
          for script in tool/*.sh; do
            bash -n "${script}"
          done
          if rg -n '\\b(mapfile|readarray)\\b' tool/*.sh; then
            echo 'release scripts must remain compatible with macOS system Bash 3.2' >&2
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test --no-pub --reporter expanded
